<head>
  <meta charset='utf-8' />
  <script src='https://cdn.jsdelivr.net/npm/moment@2.27.0/min/moment.min.js'></script>
  <script src='https://cdn.jsdelivr.net/npm/moment/locale/pt-br.js'></script>
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.8/index.global.min.js'></script>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css' rel='stylesheet'>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css' rel='stylesheet'>
  <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/moment@6.1.8/index.global.min.js'></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap');

    .button-calendar {
      border: 1px solid #b5b7b9;
      background-color: #fff;
      border-radius: 4px;
      display: inline-flex;
      justify-content: center;
      align-items: center;

      &>svg {
        fill: #9FA2A8;
      }
    }

    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 1,
        'wght' 400,
        'GRAD' 0,
        'opsz' 48
    }

    .material-symbols-outlined.plus-continuidade {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 48
    }

    .plus-continuidade {
      margin-top: -4px;
      margin-bottom: -4px;
      margin-left: -4px;
    }

    :root {
      --fc-border-color: #e7e9eb !important;
    }

    .fc-scrollgrid {
      border-radius: 8px;
    }

    .gs-event-guests span {
      font-size: 14px !important;
    }

    /* ===== Scrollbar CSS ===== */
    /* Firefox */
    * {
      scrollbar-width: auto;
      scrollbar-color: #cfdef9 #ffffff;
    }

    /* Chrome, Edge, and Safari */
    *::-webkit-scrollbar {
      width: 16px;
    }

    *::-webkit-scrollbar-track {
      background: #ffffff;
    }

    *::-webkit-scrollbar-thumb {
      background-color: #cfdef9;
      border-radius: 10px;
      border: 3px solid #ffffff;
    }


    * {
      font-family: 'Inter';

    }

    html,
    body,
    #calendar {
      height: 100%;
      overflow: hidden !important;
    }

    .fa-user:before {
      content: "";
    }

    .fc-timeline-slot-cushion {
      white-space: pre-line !important;
      text-transform: capitalize;
      text-align: center;
    }

    .resource-wrapper {
      display: flex;
      flex-direction: row;
      align-items: center;
      column-gap: 8%;

    }

    .fc-event {
      cursor: pointer;
      transition: 200ms;
    }

    .fc-event:hover {
      transform: scale(1.05);
    }

    .resource-wrapper .resource-thumb {
      width: 40px;
      height: 40px;
      border-radius: 200px !important;
      object-fit: cover;
      border-radius: 0.4em;
    }

    .resource-wrapper .resource-title {
      font-size: 13px;
      font-weight: 500;
    }

    .fc-timeline-events {
      padding: 0px !important;
      height: 100% !important;
    }

    .fc-timeline-event-harness {
      top: 50% !important;
      transform: translateY(-50%);
      z-index: 99;
    }

    .fc-event {
      padding: 4px 12px !important;
      border-radius: 200px !important;
    }

    .fc-event:has(.gs-event-indisponibilidade) {
      border-radius: 6px !important;
      transform: translate(-6px, 1px);
      height: 100% !important;
    }

    .fc-datagrid-cell-main {
      font-size: 14px !important;
      font-weight: 500;
    }

    .fc-slot-today {
      background-color: rgba(49, 234, 114, 0.2);
      outline: 2px solid rgb(49, 234, 114);

    }

    th .fc-datagrid-cell-main {
      font-size: 14px !important;
      color: #747474 !important;
      padding-left: 12px !important;
      text-transform: uppercase !important;
    }

    thead {
      background-color: #fafbfd;
    }

    .fc-resource-timeline-divider {
      border: 0px !important;
      background-color: #EBF2FF !important;
      box-shadow: 15px 0px 18px 12px rgba(0, 0, 0, 0.02);
    }

    .fc-resource-timeline-divider:hover {
      background-color: #cfdef9 !important;
    }

    .gs-event-wrapper,
    .gs-event-continuidade {
      display: flex;
      flex-direction: row;
      flex-wrap: no-wrap;
      overflow: hidden;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 4px;
    }

    .gs-event-indisponibilidade {
      display: flex;
      flex-direction: row;
      overflow: hidden;
      align-items: center;
      position: relative;
      padding: 4px;
      height: 100%;
      flex-wrap: no-wrap;

    }

    .gs-event-continuidade,
    .gs-event-indisponibilidade {
      justify-content: flex-start !important;
      column-gap: 6px;
    }

    .gs-event-continuidade::before {
      content: '';
      background-color: #30C46D;
      width: 21px;
      height: 21px;
      border-radius: 2px;
      transform: translateX(-19px) translateY(-50%) rotate(45deg);
      position: fixed;
      top: 49%;
      z-index: -1;
    }

    .gs-event-guests {
      min-width: 25px;
      font-size: 12px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
    }

    .gs-event-title {
      white-space: nowrap;
      overflow: hidden;
    }

    .fc-timeline-slot-frame {
      justify-content: center !important;
      font-size: 12px;


    }

    .fc-theme-standard .fc-scrollgrid {
      border: 0px !important;
    }

    .fc-timeline-slot-frame a {
      color: #747474;
      font-weight: 400;
      text-decoration: none !important;
      padding: 10px 0px !important;
      font-size: 13px !important;
      text-transform: uppercase !important;
    }

    .fc-sticky {
      padding: 0px !important;
    }
  </style>

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <div style="display: flex; justify-content: end; padding: 8px; gap: 12px;">
    <button class="button-calendar" id="navPrev">
      <svg style="width: 25px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M10.8284 12.0007L15.7782 16.9504L14.364 18.3646L8 12.0007L14.364 5.63672L15.7782 7.05093L10.8284 12.0007Z">
        </path>
      </svg>
    </button>
    <button class="button-calendar" id="navNext">
      <svg style="width: 25px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M13.1717 12.0007L8.22192 7.05093L9.63614 5.63672L16.0001 12.0007L9.63614 18.3646L8.22192 16.9504L13.1717 12.0007Z">
        </path>
      </svg>
    </button>
  </div>
  <div id='calendar' style="padding-bottom: 44px;"></div>
</body>
<script>
  window.addEventListener('message', function (event) {
    const data = event.data;
    iniciarCalendario(data)
  })

  function iniciarCalendario(data) {
    moment.locale('pt-br');
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'resourceTimelineCustom',
      schedulerLicenseKey: 'GPL-My-Project-Is-Open-Source',
      navLinks: false,
      headerToolbar: false,
      eventMaxStack: 1,
      locale: 'pt-br',
      timeZone: 'America/Sao_Paulo',
      themeSystem: 'bootstrap5',
      nowIndicator: 'true',
      resourceAreaColumns: [
        {
          field: 'title',
          headerContent: 'Acomodações'
        }
      ],
      resources: data.resources,
      events: data.events,
      initialDate: data.initialDate,
      resourceLabelContent: function (arg) {
        return {
          html: `
            <div class="resource-wrapper"> 
                <img class="resource-thumb" src="${arg.resource.extendedProps.image}" alt="${arg.resource.title}">
                <span class="resource-title">${arg.resource.title}</span> 
            </div>
        `
        };
      },
      views: {
        resourceTimelineCustom: {
          type: 'resourceTimeline',
          eventContent: function (arg) {
            var publicId = arg.event._def.publicId
            var title = arg.event.title;
            var numGuests = arg.event.extendedProps.hospedes;
            var tipo = arg.event.extendedProps.tipo;
            var obs = arg.event.extendedProps.obs
            if (tipo === 'Continuidade') {
              return {
                html: `
                    <div id='${tipo + "-" + publicId}' class='gs-event-continuidade'>
<span class="material-symbols-outlined plus-continuidade">add_circle</span>
<div class='gs-event-title'>${tipo}</div>       
                    </div>
                `
              };
            } else if (tipo === 'Indisponibilidade') {
              return {
                html: `
                    <div id='${tipo + "-" + publicId}' class='gs-event-wrapper'>
<span class="material-symbols-outlined">block</span>                        
<div class='gs-event-title'>${obs}</div>
</div>
                `
              }
            } else {
              return {
                html: `
                    <div id='${tipo + "-" + publicId}' class='gs-event-wrapper'>
                        <div class='gs-event-title'>${title}</div>
                        <div class='gs-event-guests'>
                            <span class="material-symbols-outlined">person</span>${numGuests}
                        </div>
                    </div>
                `
              };
            }
          },
          resourceAreaWidth: '200px',
          duration: {
            months: 1,
          },
          slotMinWidth: 60,
          slotMinTime: '00:00:00',
          slotMaxTime: '24:00:00',
          slotLabelInterval: '24:00:00',
          slotDuration: '24:00:00',
          titleFormat: {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
          },
          slotLabelClassNames: function (arg) {
            if (arg.level === 1) {
              return ['mes-header'];
            } else {
              return [];
            }
          },

          slotLabelFormat: [
            {
              month: 'long',
              year: 'numeric'
            },
            'ddd [\n] DD',
          ]
        }
      }
    });
    calendar.render();
    /* ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++ */
    calendar.on('eventClick', function (info) {
      const button = window.parent.document.getElementById('bttn-log')
      button.setAttribute('data-value', JSON.stringify(info))
      button.click()
    });
    /* ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++ */

    let navNext = document.getElementById("navNext");
    let navPrev = document.getElementById("navPrev");
    navNext.addEventListener("click", () => {
      calendar.next();
    })
    navPrev.addEventListener("click", () => {
      calendar.prev();
    })
  }
</script>
